{% set name = "stemflow" %}
{% set version = "2.0.0" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://pypi.org/packages/source/{{ name[0] }}/{{ name }}/{{ name }}-{{ version }}.tar.gz
  sha256: 95e149cc8c73291feafce7eb4cd8f6296a3331b061ecb7632ec332b29922a2a9

build:
  noarch: python
  script: {{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation
  number: 0

requirements:
  host:
    - python {{ python_min }}
    - pip
    - setuptools >=68.2.0
    - wheel

  run:
    - python >={{ python_min }}
    - matplotlib-base >=3.7.1
    - numpy >=1.24.3
    - pandas >=2.2.0
    - scikit-learn >=1.2.2
    - tqdm >=4.65.0
    - scipy >=1.10.1
    - plotly >=5.9.0
    - joblib >=1.4.2
    - setuptools >=68.2.0
    - duckdb >=1.1.3,<3
    - pyarrow >=17.0.0
    - cartopy >=0.22

test:
  imports:
    - stemflow
    - stemflow.calibration
    - stemflow.tuning
    - stemflow.lazyloading.data_preparation
    - stemflow.utils.execution_monitor
    - stemflow.model.AdaSTEM
  requires:
    - pip
    - python {{ python_min }}
  commands:
    - pip check
    - python -c "import stemflow; assert stemflow.__version__ == '{{ version }}'"

about:
  home: https://github.com/chenyangkang/stemflow
  license: MIT
  license_family: MIT
  license_file: LICENSE
  summary: "A package for Adaptive Spatio-Temporal Model (AdaSTEM) in python"
  doc_url: https://chenyangkang.github.io/stemflow/
  dev_url: https://github.com/chenyangkang/stemflow
  description: |
    stemflow is a toolkit for Adaptive Spatio-Temporal Model (AdaSTEM) in python. 
    A typical usage is daily abundance estimation using eBird citizen science data. 
    It leverages the "adjacency" information of surrounding target values in space and time, 
    to predict the classes/continuous values of target spatial-temporal points.

extra:
  recipe-maintainers:
    - chenyangkang
